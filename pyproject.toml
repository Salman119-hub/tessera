[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tessera"
version = "0.9.0"
description = "A feature platform for real-time ML with exact training/serving parity."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Salman Mujtaba" }]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]
kafka = ["confluent-kafka>=2.3"]
redis = ["redis>=5.0"]
parquet = ["pyarrow>=15"]
azure = ["adlfs>=2024.4", "pyarrow>=15"]
spark = ["pyspark>=3.5", "pyarrow>=15"]
mlflow = ["mlflow>=2.12"]
dev = [
  "tessera[api]",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
  "pandas-stubs",
  "types-PyYAML",
]

[project.scripts]
tessera = "tessera.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tessera"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "BLE", "C4", "PIE", "PT"]
ignore = ["B008", "B905", "RUF012", "S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011", "PT018"]
"examples/**" = ["S"]
"pipelines/**" = ["S"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src/tessera"]

[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "redis.*", "uvicorn.*", "mlflow.*", "pyspark.*", "fsspec.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = ["slow: end-to-end tests on the generated example dataset"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:Warning"]

[tool.coverage.run]
source = ["tessera"]
branch = true
omit = ["*/tessera/kafka.py", "*/tessera/online/redis_store.py", "*/tessera/mlops.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
