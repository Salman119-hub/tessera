name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests examples pipelines scripts
      - run: ruff format --check src tests examples pipelines scripts
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - run: pip install -e ".[dev]"
      - run: pytest --cov --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with: { name: coverage, path: coverage.xml }

  # The parity claim is the product. Run the full demo on every change: it trains,
  # serves a live day through the stream processor and fails if the skew audit of
  # the clean replay finds any mismatch.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - run: python examples/fraud/generate_data.py --cards 600 --days 14
      - run: python examples/fraud/run_demo.py --workdir "$RUNNER_TEMP/demo" --strict | tee demo.txt
      - uses: actions/upload-artifact@v4
        with: { name: demo-output, path: demo.txt }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tessera:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test
        run: |
          docker run -d --name tessera -p 8080:8080 -e TESSERA_ONLINE_STORE=memory:// \
            -e TESSERA_FEATURE_LOG= tessera:ci
          for i in $(seq 1 30); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs localhost:8080/v1/registry | grep -q fraud_v1

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: infra/terraform }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/tessera
      - run: helm template tessera deploy/helm/tessera --set keyVault.name=kv-ci > /dev/null
