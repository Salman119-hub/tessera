# Local stack: Redpanda (Kafka API), Redis (online store), the API and the stream processor.
#
#   docker compose up --build
#   python scripts/publish_events.py --limit 2000      # replay example events into Kafka
#   curl -s localhost:8080/v1/features -H 'content-type: application/json' \
#     -d '{"service":"fraud_v1","rows":[{"card_id":"c00001","merchant_id":"m0003",
#          "amount":120,"merchant_country":"US","channel":"online"}]}'

x-tessera: &tessera
  build: .
  image: tessera:dev
  environment:
    TESSERA_REPO_PATH: /app/examples/fraud/features.py
    TESSERA_ONLINE_STORE: redis://redis:6379/0
    TESSERA_KAFKA__BOOTSTRAP_SERVERS: redpanda:9092
    TESSERA_FEATURE_LOG: /data/feature_log.jsonl
    TESSERA_DEAD_LETTER: /data/dead_letter.jsonl
    TESSERA_MODEL_DIR: /data/models
  volumes:
    - tessera-data:/data
  depends_on:
    redis:
      condition: service_healthy
    redpanda:
      condition: service_healthy

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M
      - --kafka-addr PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
      - --node-id 0 --check=false
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      retries: 20

  topic-init:
    image: redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["rpk", "topic", "create", "payments.transactions.v1", "-p", "6", "--brokers", "redpanda:9092"]
    restart: "no"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    <<: *tessera
    ports: ["8080:8080"]

  stream:
    <<: *tessera
    command: ["tessera", "stream", "--batch-size", "500"]
    healthcheck:
      disable: true

volumes:
  tessera-data:
