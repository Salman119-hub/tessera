apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "tessera.labels" . | nindent 4 }}
data:
  tessera.yaml: |
    {{- toYaml .Values.config | nindent 4 }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Release.Name }}-kv
  labels:
    {{- include "tessera.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.identity.api.clientId | quote }}
    keyvaultName: {{ .Values.keyVault.name | quote }}
    tenantId: {{ .Values.identity.tenantId | quote }}
    objects: |
      array:
      {{- range .Values.keyVault.secrets }}
        - |
          objectName: {{ .objectName }}
          objectType: secret
      {{- end }}
  secretObjects:
    - secretName: {{ .Release.Name }}-kv
      type: Opaque
      data:
      {{- range .Values.keyVault.secrets }}
        - objectName: {{ .objectName }}
          key: {{ .objectName }}
      {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tessera-api
  annotations:
    azure.workload.identity/client-id: {{ .Values.identity.api.clientId | quote }}
  labels:
    {{- include "tessera.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tessera-stream
  annotations:
    azure.workload.identity/client-id: {{ .Values.identity.stream.clientId | quote }}
  labels:
    {{- include "tessera.labels" . | nindent 4 }}
